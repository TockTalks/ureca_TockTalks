spring:
  application:
    name: tocktalks

  task:
    scheduling:
      pool:
        size: 5

  datasource:
    url: jdbc:mysql://localhost:3307/tocktalks?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: tocktalks
    password: tocktalks
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # DB/네트워크 쪽에서 idle 커넥션을 기본값(30분)보다 먼저 끊는 경우가 있어서,
      # 죽은 커넥션을 오래 들고 있지 않도록 커넥션 수명을 짧게 잡는다.
      max-lifetime: 600000   # 10분
# hello world!
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  data:
    redis:
      host: localhost
      port: 6379
      # 기본값(60초)이면 Redis 연결이 잠깐 끊겼을 때 그 순간 요청들이 최대 1분씩
      # 멈춰버린다 (JwtAuthenticationFilter가 모든 인증 요청마다 Redis를 거치므로 영향이 큼).
      # 짧게 잡아서 빨리 실패하고 다음 재연결을 기다리게 한다.
      timeout: 3s

server:
  port: 8080

app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  room:
    default-seed-money: 10000000  # 1천만원
  login-attempt:
    max-attempts: 5
    lock-duration-ms: 300000  # 5분
# 허접들아 나 왔다감
# ??? : 모를걸요 ?
# JWT_SECRET은 기본값 없이 필수로 요구한다 - 예전에 플레이스홀더 값이 그대로 git에
# 커밋돼있던 적이 있어서, 값을 안 넣으면 그냥 기동을 실패시키는 쪽이 안전하다.
# 로컬 개발 시 .env에 JWT_SECRET=$(openssl rand -base64 64) 로 생성해서 채워 넣는다.
jwt:
  secret: ${JWT_SECRET}
  access-token-expire-ms: 3600000      # 1시간
  refresh-token-expire-ms: 1209600000  # 14일

# 외부 시세 API (한국투자증권 / 업비트 등) - 발급받은 키로 교체
external-api:
  stock:
    app-key: ${STOCK_API_APP_KEY:}
    app-secret: ${STOCK_API_APP_SECRET:}
    rest-base-url: ${STOCK_API_REST_BASE_URL:}
    websocket-url: ${STOCK_API_WEBSOCKET_URL:}
  oauth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:}
logging:
  level:
    com.tocktalks: INFO
    org.hibernate: warn